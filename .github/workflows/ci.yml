name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Required status check of the main ruleset; renaming it blocks every merge.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install -g @anthropic-ai/claude-code@2.1.281
      - run: bash tests/all.sh

  # Hooks must run on macOS /bin/bash 3.2. Not a required check (the ruleset names only `check`).
  bash32:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: /bin/bash --version && jq --version
      - run: HOOK_BASH=/bin/bash bash tests/hooks/run.sh
      - run: HOOK_BASH=/bin/bash bash tests/hooks/lifecycle.sh
      - run: HOOK_BASH=/bin/bash bash tests/hooks/timing.sh
